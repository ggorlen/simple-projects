<script src="https://cdn.jsdelivr.net/gh/Kranf99/IOKranf@eeb4bab/lib/iokranf.js"></script>
<pre id="iok"></pre>
<script type="module">
const {println, printhr, input, click, close} = new IOKranf("iok");

println("Hello!");
printhr();

println("Are you happy?!");
const response = await click("yes", "no");
println("you clicked " + response + "\n");

const name = await input("Enter your name:");
println("Hello " + name + "\n");
close();
</script>
